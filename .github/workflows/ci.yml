name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sayship
          POSTGRES_PASSWORD: sayship
          POSTGRES_DB: sayship_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sayship"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgres://sayship:sayship@localhost:5432/sayship_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and API tests (vitest + supertest)
        shell: bash
        run: npm test 2>&1 | tee vitest.log

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (production build, mock LLM)
        shell: bash
        run: npm run test:e2e 2>&1 | tee e2e.log

      # Job logs of public repos need a GitHub sign-in to read; annotations don't.
      - name: Publish failing output as annotations
        if: failure()
        shell: bash
        run: |
          for f in vitest.log e2e.log; do
            [ -f "$f" ] || continue
            msg=$(tail -n 60 "$f" | sed 's/\x1b\[[0-9;]*m//g' | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=${f} (last 60 lines)::${msg}"
          done

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
