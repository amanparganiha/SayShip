# Local Postgres for development and tests. On Replit, DATABASE_URL comes from Replit PostgreSQL instead.
services:
  postgres:
    image: postgres:16-alpine
    container_name: promptship-postgres
    environment:
      POSTGRES_USER: promptship
      POSTGRES_PASSWORD: promptship
      POSTGRES_DB: promptship
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptship"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
