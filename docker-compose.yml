# Local Postgres for development and tests. On Replit, DATABASE_URL comes from Replit PostgreSQL instead.
# A fixed project name keeps container/volume names stable whatever the checkout folder is called.
name: sayship

services:
  postgres:
    image: postgres:16-alpine
    container_name: sayship-postgres
    environment:
      POSTGRES_USER: sayship
      POSTGRES_PASSWORD: sayship
      POSTGRES_DB: sayship
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sayship"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
